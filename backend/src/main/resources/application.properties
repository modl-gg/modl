spring.application.name=modl
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
spring.web.error.whitelabel.enabled=false
spring.web.resources.add-mappings=false
spring.jackson.default-property-inclusion=non_null
spring.lifecycle.timeout-per-shutdown-phase=10s

server.port=${MODL_PORT:8080}
server.address=${MODL_BIND_ADDRESS:0.0.0.0}
server.shutdown=graceful
server.compression.enabled=true
server.tomcat.basedir=${modl.data-dir}/tmp/tomcat
server.tomcat.accept-count=200
server.tomcat.connection-timeout=10s

spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
spring.servlet.multipart.location=${modl.data-dir}/tmp/multipart
spring.servlet.multipart.resolve-lazily=true

modl.instance.public-url=${MODL_PUBLIC_URL:}
modl.instance.admin-email=${MODL_ADMIN_EMAIL:}
modl.instance.server-name=${MODL_SERVER_NAME:}
modl.instance.api-key=${MODL_API_KEY:}
modl.instance.internal-api-key=${MODL_INTERNAL_API_KEY:}
modl.instance.trust-proxy-headers=${MODL_TRUST_PROXY_HEADERS:false}
modl.instance.trusted-proxy=${MODL_TRUSTED_PROXY:private}

modl.data-dir=${MODL_DATA_DIR:./data}
modl.setup.code-file=${MODL_SETUP_CODE_FILE:}

modl.database.url=${MODL_DATABASE_URL:}
modl.database.username=${MODL_DATABASE_USERNAME:}
modl.database.password=${MODL_DATABASE_PASSWORD:}
modl.database.pool-size=${MODL_DATABASE_POOL_SIZE:10}
modl.database.sqlite.native-dir=${MODL_SQLITE_NATIVE_DIR:}
modl.database.reopen=${MODL_DATABASE_REOPEN:}
spring.flyway.enabled=false

modl.limits.max-upload-mb=${MODL_MAX_UPLOAD_MB:}
modl.limits.max-storage-gb=${MODL_MAX_STORAGE_GB:}
modl.limits.backup-keep=${MODL_BACKUP_KEEP:}
modl.limits.backup-hour=${MODL_BACKUP_HOUR:}
modl.limits.ip-history-days=${MODL_IP_HISTORY_DAYS:}
modl.limits.notification-days=${MODL_NOTIFICATION_EXPIRY_DAYS:}

modl.mail.host=${MODL_SMTP_HOST:}
modl.mail.port=${MODL_SMTP_PORT:}
modl.mail.username=${MODL_SMTP_USERNAME:}
modl.mail.password=${MODL_SMTP_PASSWORD:}
modl.mail.from=${MODL_SMTP_FROM:}
modl.mail.starttls=${MODL_SMTP_STARTTLS:}

modl.ai.provider=${MODL_AI_PROVIDER:}
modl.ai.api-key=${MODL_AI_API_KEY:}
modl.ai.model=${MODL_AI_MODEL:}
modl.ai.base-url=${MODL_AI_BASE_URL:}
modl.ai.gemini-api-key=${MODL_GEMINI_API_KEY:}

modl.storage.type=${MODL_STORAGE:}
modl.storage.s3.endpoint=${MODL_S3_ENDPOINT:}
modl.storage.s3.region=${MODL_S3_REGION:}
modl.storage.s3.bucket=${MODL_S3_BUCKET:}
modl.storage.s3.access-key=${MODL_S3_ACCESS_KEY:}
modl.storage.s3.secret-key=${MODL_S3_SECRET_KEY:}
modl.storage.s3.public-url=${MODL_S3_PUBLIC_URL:}
modl.storage.unattached-upload-ttl=${MODL_STORAGE_UNATTACHED_UPLOAD_TTL:PT24H}

modl.migration.upload-dir=${modl.data-dir}/tmp/migrations
modl.migration.max-upload-mb=${MODL_IMPORT_MAX_UPLOAD_MB:500}

modl.deployment=${MODL_DEPLOYMENT:}
modl.update.check=${MODL_UPDATE_CHECK:}
modl.update.pre-update-backup=${MODL_PRE_UPDATE_BACKUP:true}
modl.update.allow-downgrade=${MODL_ALLOW_DOWNGRADE:false}
modl.update.base-url=${MODL_UPDATE_BASE_URL:https://github.com/modl-gg/modl/releases}
modl.update.api-url=${MODL_UPDATE_API_URL:https://api.github.com/repos/modl-gg/modl/releases}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.mail.enabled=false
management.observations.enable.http.server.requests=false

logging.level.org.apache.coyote.http11.Http11Processor=WARN
logging.level.org.springframework.web.socket.server.support.DefaultHandshakeHandler=OFF
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
