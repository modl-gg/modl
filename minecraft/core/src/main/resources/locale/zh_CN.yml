# Words substituted into punishment messages.
punishment_words:
  # {tense}, as in "You {tense} banned"
  tense_default: "已被"
  tense_active: "当前被"
  # {tense2}, as in "Your account {tense2} restricted"
  tense2_default: "已"
  tense2_active: "当前"
  # {temp}, as in "You have been {temp} banned"
  temporarily: "临时"
  permanently: "永久"
  # Expiry texts of timed punishments; {type} is type_ban, type_mute or type_punishment
  will_expire: "\n&7此{type}将在 &f{duration}&7 后到期。"
  duration_formatted: "\n&7此{type}将在 {duration} 后到期"
  mute_duration_formatted: "，为期 {duration}"
  # {for_duration} on timed mutes; keep the leading space
  for_duration: "，为期 {duration}"
  type_ban: "封禁"
  type_mute: "禁言"
  type_punishment: "处罚"
  # {duration} of permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "永久"

punishments:
  public_notification:
    ban_default: "&c{target} 已被封禁。"
    mute_default: "&c{target} 已被禁言。"
    kick_default: "&c{target} 已被踢出。"
    default: "&c{target} 已被处罚。"
  mute_fallback: "&c你已被禁言。"
  player_notification:
    ban_default: "&c你{tense}封禁 (#{id})。"
    mute_default: "&c你{tense}禁言 (#{id})。"
    kick_default: "&c你已被踢出服务器 (#{id})。"
    default: "&c你{tense}处罚 (#{id})。"

# punishment_types.ordinal_<n>: public_notification is broadcast, player_notification lines go to the punished player.
# Types without an entry use the punishments section. Placeholders: https://github.com/modl-gg/modl/wiki/Placeholders#punishment-messages
punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} 已被踢出。"
    player_notification:
      - "&c&l你已被踢出服务器。"
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&c{target} 已被禁言。"
    player_notification:
      - ""
      - "&c你{tense}{temp}禁言{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&c{target} 已被封禁。"
    player_notification:
      - "&c&l你{tense}{temp}封禁，原因："
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7认为这是误判？请前往 {appeal_url} 使用 ID #{id} 提交申诉。"

  ordinal_3: # Security Ban
    public_notification: "&c{target} 已被封禁。"
    player_notification:
      - "&c&l你的账号{tense2}因安全问题而受到限制。"
      - "&f我们在你的账号上检测到可疑活动。请先确保账号安全，然后前往 {appeal_url} 使用 ID #{id} 提交申诉。"

  ordinal_4: # Linked Ban
    public_notification: "&c{target} 已被封禁。"
    player_notification:
      - "&c&l你的账号{tense2}与一个被封禁的账号相关联。"
      - ""
      - "&f严禁使用小号规避封禁或与他人共享账号。"
      - ""
      - "&7当关联的封禁到期后，此封禁将自动解除。"
      - "&7认为这是误判？请前往 {appeal_url} 使用 ID #{id} 提交申诉"

  ordinal_5: # Blacklist
    public_notification: "&c{target} 已被列入黑名单。"
    player_notification:
      - "&c你{tense}列入黑名单"
      - "&7ID: #{id}"

  ordinal_6: # Chat Abuse
    public_notification: "&c{target} 因滥用聊天已被禁言。"
    player_notification:
      - ""
      - "&c你{tense}{temp}禁言{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # Anti-Social
    public_notification: "&c{target} 因不友善行为已被禁言。"
    player_notification:
      - ""
      - "&c你{tense}{temp}禁言{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""

  ordinal_8: # Targeting
    public_notification: "&c{target} 因针对性骚扰已被封禁。"
    player_notification:
      - "&c&l你{tense}{temp}封禁，原因："
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7认为这是误判？请前往 {appeal_url} 使用 ID #{id} 提交申诉。"

  ordinal_9: # Bad Content
    public_notification: "&c{target} 因发布不当内容已被封禁。"
    player_notification:
      - "&c&l你{tense}{temp}封禁，原因："
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7认为这是误判？请前往 {appeal_url} 使用 ID #{id} 提交申诉。"

  ordinal_10: # Bad Username
    public_notification: "&c{target} 已被封禁。"
    player_notification:
      - "&c&l你{tense}封禁，原因是你的 Minecraft 用户名。"
      - ""
      - "&f{reason}"
      - ""
      - "&7当你更改用户名后，此封禁将自动解除。"
      - "&7认为这是误判？请前往 {appeal_url} 使用 ID #{id} 提交申诉"

  ordinal_11: # Bad Skin
    public_notification: "&c{target} 已被封禁。"
    player_notification:
      - "&c&l你{tense}封禁，原因是你的 Minecraft 皮肤。"
      - ""
      - "&f{reason}"
      - ""
      - "&7当你更换皮肤后，此封禁将自动解除。"
      - "&7认为这是误判？请前往 {appeal_url} 使用 ID #{id} 提交申诉"

  ordinal_12: # Team Abuse
    public_notification: "&c{target} 因滥用组队机制已被封禁。"
    player_notification:
      - "&c&l你{tense}{temp}封禁，原因："
      - ""
