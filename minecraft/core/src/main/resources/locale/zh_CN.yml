      - "&7{will_expire}"
      - "&7认为这是误判？请前往 {appeal_url} 使用 ID #{id} 提交申诉。"

  ordinal_13: # Game Abuse
    public_notification: "&c{target} 因滥用游戏机制已被封禁。"
    player_notification:
      - "&c&l你{tense}{temp}封禁，原因："
