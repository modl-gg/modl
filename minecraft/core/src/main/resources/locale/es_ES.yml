# Words substituted into punishment messages.
punishment_words:
  # {tense}, as in "You {tense} banned"
  tense_default: "Has sido"
  tense_active: "Estás"
  # {tense2}, as in "Your account {tense2} restricted"
  tense2_default: "ha sido"
  tense2_active: "está"
  # {temp}, as in "You have been {temp} banned"
  temporarily: "temporalmente"
  permanently: "permanentemente"
  # Expiry texts of timed punishments; {type} is type_ban, type_mute or type_punishment
  will_expire: "\n&7Tu {type} expirará en &f{duration}&7."
  duration_formatted: "\n&7Tu {type} expirará en {duration}"
  mute_duration_formatted: " por {duration}"
  # {for_duration} on timed mutes; keep the leading space
  for_duration: " por {duration}"
  type_ban: "baneo"
  type_mute: "silenciamiento"
  type_punishment: "sanción"
  # {duration} of permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "permanente"

# punishment_types.ordinal_<n>: public_notification is broadcast, player_notification lines go to the punished player.
# Types without an entry use the punishments section. Placeholders: https://github.com/modl-gg/modl/wiki/Placeholders#punishment-messages
punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} ha sido expulsado."
    player_notification:
      - "&c&lHas sido expulsado del servidor."
      - "&f{reason} &7(#{id})"
  ordinal_1: # Manual Mute
    public_notification: "&c{target} ha sido silenciado."
    player_notification:
      - ""
      - "&c{tense} {temp} silenciado{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""
  ordinal_2: # Manual Ban
    public_notification: "&c{target} ha sido baneado."
    player_notification:
      - "&c&l{tense} {temp} baneado por:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7¿Es un error? Apela en {appeal_url} usando el ID #{id}."
  ordinal_3: # Security Ban
    public_notification: "&c{target} ha sido baneado."
    player_notification:
      - "&c&lTu cuenta {tense2} restringida debido a problemas de seguridad."
      - "&fSe ha detectado actividad sospechosa en tu cuenta. Por favor asegura tu cuenta y abre una apelación en {appeal_url} usando el ID #{id}."
  ordinal_4: # Linked Ban
    public_notification: "&c{target} ha sido baneado."
    player_notification:
      - "&c&lTu cuenta {tense2} vinculada a una cuenta baneada."
      - ""
      - "&fEvadir baneos mediante el uso de cuentas alternativas o compartir tu cuenta está estrictamente prohibido."
      - ""
      - "&7Este baneo se levantará automáticamente cuando el baneo vinculado expire."
      - "&7¿Es un error? Apela en {appeal_url} usando el ID #{id}"
  ordinal_5: # Blacklist
    public_notification: "&c{target} ha sido incluido en la lista negra."
    player_notification:
      - "&c{tense} incluido en la lista negra"
      - "&7ID: #{id}"
  ordinal_6: # Chat Abuse
    public_notification: "&c{target} ha sido silenciado por abuso de chat."
    player_notification:
      - ""
      - "&c{tense} {temp} silenciado{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # Anti-Social
    public_notification: "&c{target} ha sido silenciado por comportamiento antisocial."
    player_notification:
      - ""
      - "&c{tense} {temp} silenciado{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_8: # Targeting
    public_notification: "&c{target} ha sido baneado por acoso dirigido."
    player_notification:
      - "&c&l{tense} {temp} baneado por:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7¿Es un error? Apela en {appeal_url} usando el ID #{id}."
  ordinal_9: # Bad Content
    public_notification: "&c{target} ha sido baneado por contenido inapropiado."
    player_notification:
      - "&c&l{tense} {temp} baneado por:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7¿Es un error? Apela en {appeal_url} usando el ID #{id}."
  ordinal_10: # Bad Username
    public_notification: "&c{target} ha sido baneado."
    player_notification:
      - "&c&l{tense} baneado debido a tu nombre de usuario de Minecraft."
      - ""
      - "&f{reason}"
      - ""
      - "&7Este baneo se levantará automáticamente cuando cambies tu nombre de usuario."
      - "&7¿Es un error? Apela en {appeal_url} usando el ID #{id}"
  ordinal_11: # Bad Skin
    public_notification: "&c{target} ha sido baneado."
    player_notification:
      - "&c&l{tense} baneado debido a tu skin de Minecraft."
      - ""
      - "&f{reason}"
      - ""
      - "&7Este baneo se levantará automáticamente cuando cambies tu skin."
      - "&7¿Es un error? Apela en {appeal_url} usando el ID #{id}"
  ordinal_12: # Team Abuse
    public_notification: "&c{target} ha sido baneado por abuso de equipo."
    player_notification:
      - "&c&l{tense} {temp} baneado por:"
      - ""
