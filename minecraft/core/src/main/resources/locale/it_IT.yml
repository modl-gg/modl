      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}."

  ordinal_16: # Account Abuse
    public_notification: "&c{target} è stato bannato per abuso dell'account."
    player_notification:
      - "&c&l{tense} bannato {temp} per:"
