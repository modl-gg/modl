# Words substituted into punishment messages.
punishment_words:
  # {tense}, as in "You {tense} banned"
  tense_default: "bent"
  tense_active: "bent"
  # {tense2}, as in "Your account {tense2} restricted"
  tense2_default: "is"
  tense2_active: "is"
  # {temp}, as in "You have been {temp} banned"
  temporarily: "tijdelijk"
  permanently: "permanent"
  # Expiry texts of timed punishments; {type} is type_ban, type_mute or type_punishment
  will_expire: "\n&7Deze {type} verloopt over &f{duration}&7."
  duration_formatted: "\n&7Deze {type} verloopt over {duration}"
  mute_duration_formatted: " voor {duration}"
  # {for_duration} on timed mutes; keep the leading space
  for_duration: " voor {duration}"
  type_ban: "ban"
  type_mute: "mute"
  type_punishment: "straf"
  # {duration} of permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "permanent"

# punishment_types.ordinal_<n>: public_notification is broadcast, player_notification lines go to the punished player.
# Types without an entry use the punishments section. Placeholders: https://github.com/modl-gg/modl/wiki/Placeholders#punishment-messages
punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} is van de server gekickt."
    player_notification:
      - "&c&lJe bent van de server gekickt."
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&c{target} is gedempt."
    player_notification:
      - ""
      - "&cJe {tense} {temp} gedempt{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&c{target} is verbannen."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_3: # Security Ban
    public_notification: "&c{target} is verbannen."
    player_notification:
      - "&c&lJe account {tense2} beperkt vanwege beveiligingsproblemen."
      - "&fVerdachte activiteit is gedetecteerd op je account. Beveilig je account en dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_4: # Linked Ban
    public_notification: "&c{target} is verbannen."
    player_notification:
      - "&c&lJe account {tense2} gekoppeld aan een verbannen account."
      - ""
      - "&fHet ontwijken van bans door het gebruik van alternatieve accounts of het delen van je account is strikt verboden."
      - ""
      - "&7Deze ban wordt automatisch opgeheven wanneer de gekoppelde ban verloopt."
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}"

  ordinal_5: # Blacklist
    public_notification: "&c{target} is op de zwarte lijst geplaatst."
    player_notification:
      - "&cJe {tense} op de zwarte lijst geplaatst"
      - "&7ID: #{id}"

  ordinal_6: # Chat Abuse
    public_notification: "&c{target} is gedempt wegens chatmisbruik."
    player_notification:
      - ""
      - "&cJe {tense} {temp} gedempt{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # Anti-Social
    public_notification: "&c{target} is gedempt wegens antisociaal gedrag."
    player_notification:
      - ""
      - "&cJe {tense} {temp} gedempt{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""

  ordinal_8: # Targeting
    public_notification: "&c{target} is verbannen wegens targeting."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_9: # Bad Content
    public_notification: "&c{target} is verbannen wegens ongepaste inhoud."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_10: # Bad Username
    public_notification: "&c{target} is verbannen."
    player_notification:
      - "&c&lJe {tense} verbannen vanwege je Minecraft-gebruikersnaam."
      - ""
      - "&f{reason}"
      - ""
      - "&7Deze ban wordt automatisch opgeheven wanneer je je gebruikersnaam wijzigt."
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}"

  ordinal_11: # Bad Skin
    public_notification: "&c{target} is verbannen."
    player_notification:
      - "&c&lJe {tense} verbannen vanwege je Minecraft-skin."
      - ""
      - "&f{reason}"
      - ""
      - "&7Deze ban wordt automatisch opgeheven wanneer je je skin wijzigt."
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}"

  ordinal_12: # Team Abuse
    public_notification: "&c{target} is verbannen wegens teammisbruik."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_13: # Game Abuse
    public_notification: "&c{target} is verbannen wegens spelmisbruik."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_14: # Cheating
    public_notification: "&c{target} is verbannen wegens valsspelen."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_15: # Game Trading
    public_notification: "&c{target} is verbannen wegens spelhandel."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_16: # Account Abuse
    public_notification: "&c{target} is verbannen wegens accountmisbruik."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

  ordinal_17: # Systems Abuse
    public_notification: "&c{target} is verbannen wegens systeemmisbruik."
    player_notification:
      - "&c&lJe {tense} {temp} verbannen voor:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is dit een fout? Dien een beroep in op {appeal_url} met ID #{id}."

