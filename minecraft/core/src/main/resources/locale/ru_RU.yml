      - "&7{will_expire}"
      - "&7Считаете это ошибкой? Подайте апелляцию на {appeal_url}, указав ID #{id}."

  ordinal_16: # Account Abuse
    public_notification: "&cИгрок {target} забанен за нарушения, связанные с аккаунтом."
    player_notification:
      - "&c&lВы {tense} {temp} забанены за:"
