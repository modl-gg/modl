# Set usage to "" to hide a command from the help list.
help:
  header: "&a&lmodl &av{version} &f- &eCommand List"
  entry: "&f/{command} &7- {description}"
  footer: "&ePage {page}/{total_pages}. Use &a/modl help {next_page}&e for the next page."
  no_more_pages: "&7No more pages."
  version_header: "&a&lmodl&a v{version}&f - &eModeration and Support Management System"
  version_footer: "&7GNU AGPLv3 Free Software. Use /modl help for command information."
  player_commands:
    iammuted:
      usage: "iammuted <player>"
      description: "Tell someone you are muted"
    standing:
      usage: "standing"
      description: "View your punishment standing"
    report:
      usage: "report <player>"
      description: "Report a player"
    chatreport:
      usage: "chatreport <player>"
      description: "Report a player's chat"
    claimticket:
      usage: "claimticket <id> <key>"
      description: "Link a ticket to your account"
    apply:
      usage: "apply"
      description: "Apply for a staff position"
    bugreport:
      usage: "bugreport"
      description: "Report a bug"
    support:
      usage: "support"
      description: "Open support ticket"
    link:
      usage: "modl link <code>"
      description: "Link your Minecraft account to the panel"
    panel:
      usage: "modl panel"
      description: "Get a one-time panel login link"
  staff_commands:
    staffmenu:
      usage: "staffmenu"
      description: "Open staff menu"
    inspect:
      usage: "inspect <player> [-p]"
      description: "Open player inspect menu (-p for print)"
    history:
      usage: "history <player> [-p [page]]"
      description: "Open player history (-p for print)"
    notes:
      usage: "notes <player> [-p [page]]"
      description: "Open player notes (-p for print)"
    alts:
      usage: "alts <player> [-p [page]]"
      description: "Open player alts (-p for print)"
    reports:
      usage: "reports [player] [-p [page]]"
      description: "Open reports menu (-p for print)"
    punish:
      usage: "punish <player> [type] [reason]"
      description: "Issue a punishment"
    ban:
      usage: "ban <player> [duration] [reason]"
      description: "Ban a player"
    mute:
      usage: "mute <player> [duration] [reason]"
      description: "Mute a player"
    kick:
      usage: "kick <player> [reason]"
      description: "Kick a player"
    blacklist:
      usage: "blacklist <player> [reason]"
      description: "Blacklist a player"
    pardon:
      usage: "pardon <player>"
      description: "Pardon every active and queued punishment"
    unban:
      usage: "unban <player>"
      description: "Pardon every active and queued ban"
    unmute:
      usage: "unmute <player>"
      description: "Pardon every active and queued mute"
    replay:
      usage: "replay <status|capture> [player]"
      description: "Manage replay recordings"
    modl_reload:
      usage: "modl reload"
      description: "Reload configuration"
    modl_import:
      usage: "modl import"
      description: "Import from LiteBans (console only)"
    modl_status:
      usage: "modl status"
      description: "Show a support report that is safe to share (console only)"

