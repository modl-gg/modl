# Words substituted into punishment messages.
punishment_words:
  # {tense}, as in "You {tense} banned"
  tense_default: "have been"
  tense_active: "are"
  # {tense2}, as in "Your account {tense2} restricted"
  tense2_default: "has been"
  tense2_active: "is"
  # {temp}, as in "You have been {temp} banned"
  temporarily: "temporarily"
  permanently: "permanently"
  # Expiry texts of timed punishments; {type} is type_ban, type_mute or type_punishment
  will_expire: "\n&7This {type} will expire in &f{duration}&7."
  duration_formatted: "\n&7This {type} will expire in {duration}"
  mute_duration_formatted: " for {duration}"
  # {for_duration} on timed mutes; keep the leading space
  for_duration: " for {duration}"
  type_ban: "ban"
  type_mute: "mute"
  type_punishment: "punishment"
  # {duration} of permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "permanent"

punishments:
  public_notification:
    ban_default: "&c{target} has been banned."
    mute_default: "&c{target} has been muted."
    kick_default: "&c{target} has been kicked."
    default: "&c{target} has been punished."
  mute_fallback: "&cYou are muted."
  player_notification:
    ban_default: "&cYou {tense} banned (#{id})."
    mute_default: "&cYou {tense} muted (#{id})."
    kick_default: "&cYou have been kicked (#{id})."
    default: "&cYou {tense} punished (#{id})."

# punishment_types.ordinal_<n>: public_notification is broadcast, player_notification lines go to the punished player.
# Types without an entry use the punishments section. Placeholders: https://github.com/modl-gg/modl/wiki/Placeholders#punishment-messages
punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} has been kicked."
    player_notification:
      - "&c&lYou were kicked from the server."
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&c{target} has been muted."
    player_notification:
      - ""
      - "&cYou {tense} {temp} muted{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&c{target} has been banned."
    player_notification:
      - "&c&lYou {tense} {temp} banned for:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_3: # Security Ban
    public_notification: "&c{target} has been banned."
    player_notification:
      - "&c&lYour account {tense2} restricted due to security concerns."
      - "&fSuspicious activity has been detected on your account. Please secure your account and open an appeal at {appeal_url} using ID #{id}."

  ordinal_4: # Linked Ban
    public_notification: "&c{target} has been banned."
    player_notification:
      - "&c&lYour account {tense2} linked to a banned account."
      - ""
      - "&fEvading bans through the use of alternate accounts or sharing your account is strictly prohibited."
      - ""
      - "&7This ban will be automatically lifted upon the linked ban lapsing."
      - "&7Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_5: # Blacklist
    public_notification: "&c{target} has been blacklisted."
    player_notification:
      - "&cYou {tense} blacklisted"
      - "&7ID: #{id}"

  ordinal_6: # Chat Abuse
    public_notification: "&c{target} has been muted for chat abuse."
    player_notification:
      - ""
      - "&cYou {tense} {temp} muted{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # Anti-Social
    public_notification: "&c{target} has been muted for anti-social behavior."
    player_notification:
      - ""
      - "&cYou {tense} {temp} muted{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""

  ordinal_8: # Targeting
    public_notification: "&c{target} has been banned for targeting."
    player_notification:
      - "&c&lYou {tense} {temp} banned for:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_9: # Bad Content
    public_notification: "&c{target} has been banned for inappropriate content."
    player_notification:
      - "&c&lYou {tense} {temp} banned for:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_10: # Bad Username
    public_notification: "&c{target} has been banned."
    player_notification:
      - "&c&lYou {tense} banned due to your Minecraft username."
      - ""
      - "&f{reason}"
      - ""
      - "&7This ban will be automatically lifted when you change your username."
      - "&7Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_11: # Bad Skin
    public_notification: "&c{target} has been banned."
    player_notification:
      - "&c&lYou {tense} banned due to your Minecraft skin."
      - ""
      - "&f{reason}"
      - ""
      - "&7This ban will be automatically lifted when you change your skin."
      - "&7Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_12: # Team Abuse
    public_notification: "&c{target} has been banned for team abuse."
    player_notification:
      - "&c&lYou {tense} {temp} banned for:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_13: # Game Abuse
    public_notification: "&c{target} has been banned for game abuse."
    player_notification:
      - "&c&lYou {tense} {temp} banned for:"
      - ""
      - "&f{player_description}"
