# Words substituted into punishment messages.
punishment_words:
  # {tense}, as in "You {tense} banned"
  tense_default: "wurdest"
  tense_active: "bist"
  # {tense2}, as in "Your account {tense2} restricted"
  tense2_default: "wurde"
  tense2_active: "ist"
  # {temp}, as in "You have been {temp} banned"
  temporarily: "vorübergehend"
  permanently: "dauerhaft"
  # Expiry texts of timed punishments; {type} is type_ban, type_mute or type_punishment
  will_expire: "\n&7Diese {type} läuft in &f{duration}&7 ab."
  duration_formatted: "\n&7Diese {type} läuft in {duration} ab"
  mute_duration_formatted: " für {duration}"
  # {for_duration} on timed mutes; keep the leading space
  for_duration: " für {duration}"
  type_ban: "Sperre"
  type_mute: "Stummschaltung"
  type_punishment: "Strafe"
  # {duration} of permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "permanent"

# punishment_types.ordinal_<n>: public_notification is broadcast, player_notification lines go to the punished player.
# Types without an entry use the punishments section. Placeholders: https://github.com/modl-gg/modl/wiki/Placeholders#punishment-messages
punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} wurde gekickt."
    player_notification:
      - "&c&lDu wurdest vom Server gekickt."
      - "&f{reason} &7(#{id})"
  ordinal_1: # Manual Mute
    public_notification: "&c{target} wurde stummgeschaltet."
    player_notification:
      - ""
      - "&cDu {tense} {temp} stummgeschaltet{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""
  ordinal_2: # Manual Ban
    public_notification: "&c{target} wurde gebannt."
    player_notification:
      - "&c&lDu {tense} {temp} gebannt wegen:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7Ist das ein Fehler? Lege Einspruch ein unter {appeal_url} mit ID #{id}."
  ordinal_3: # Security Ban
    public_notification: "&c{target} wurde gebannt."
    player_notification:
      - "&c&lDein Konto {tense2} aufgrund von Sicherheitsbedenken eingeschränkt."
      - "&fVerdächtige Aktivitäten wurden auf deinem Konto festgestellt. Bitte sichere dein Konto und lege Einspruch ein unter {appeal_url} mit ID #{id}."
  ordinal_4: # Linked Ban
    public_notification: "&c{target} wurde gebannt."
    player_notification:
      - "&c&lDein Konto {tense2} mit einem gebannten Konto verknüpft."
      - ""
      - "&fDas Umgehen von Banns durch die Verwendung von Zweitkonten oder das Teilen deines Kontos ist strengstens untersagt."
      - ""
      - "&7Dieser Bann wird automatisch aufgehoben, wenn der verknüpfte Bann abläuft."
      - "&7Ist das ein Fehler? Lege Einspruch ein unter {appeal_url} mit ID #{id}"
  ordinal_5: # Blacklist
    public_notification: "&c{target} wurde auf die schwarze Liste gesetzt."
    player_notification:
      - "&cDu {tense} auf die schwarze Liste gesetzt"
      - "&7ID: #{id}"
  ordinal_6: # Chat Abuse
    public_notification: "&c{target} wurde wegen Chat-Missbrauch stummgeschaltet."
    player_notification:
      - ""
      - "&cDu {tense} {temp} stummgeschaltet{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # Anti-Social
    public_notification: "&c{target} wurde wegen unsozialem Verhalten stummgeschaltet."
    player_notification:
      - ""
      - "&cDu {tense} {temp} stummgeschaltet{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_8: # Targeting
    public_notification: "&c{target} wurde wegen gezielter Belästigung gebannt."
    player_notification:
      - "&c&lDu {tense} {temp} gebannt wegen:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Ist das ein Fehler? Lege Einspruch ein unter {appeal_url} mit ID #{id}."
  ordinal_9: # Bad Content
    public_notification: "&c{target} wurde wegen unangemessener Inhalte gebannt."
    player_notification:
      - "&c&lDu {tense} {temp} gebannt wegen:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Ist das ein Fehler? Lege Einspruch ein unter {appeal_url} mit ID #{id}."
  ordinal_10: # Bad Username
    public_notification: "&c{target} wurde gebannt."
    player_notification:
      - "&c&lDu {tense} aufgrund deines Minecraft-Benutzernamens gebannt."
      - ""
      - "&f{reason}"
      - ""
      - "&7Dieser Bann wird automatisch aufgehoben, wenn du deinen Benutzernamen änderst."
      - "&7Ist das ein Fehler? Lege Einspruch ein unter {appeal_url} mit ID #{id}"
  ordinal_11: # Bad Skin
    public_notification: "&c{target} wurde gebannt."
    player_notification:
      - "&c&lDu {tense} aufgrund deines Minecraft-Skins gebannt."
      - ""
      - "&f{reason}"
      - ""
      - "&7Dieser Bann wird automatisch aufgehoben, wenn du deinen Skin änderst."
      - "&7Ist das ein Fehler? Lege Einspruch ein unter {appeal_url} mit ID #{id}"
  ordinal_12: # Team Abuse
    public_notification: "&c{target} wurde wegen Teammissbrauch gebannt."
    player_notification:
      - "&c&lDu {tense} {temp} gebannt wegen:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Ist das ein Fehler? Lege Einspruch ein unter {appeal_url} mit ID #{id}."
  ordinal_13: # Game Abuse
    public_notification: "&c{target} wurde wegen Spielmissbrauch gebannt."
    player_notification:
