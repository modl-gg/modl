# Paper server features of modl (staff mode, freeze, anticheat reports, stat wipes)
# The panel connection is set in connection.yml. Replays and the anticheat integration are set in the panel.

# Console commands run on a stat wipe. Placeholders: {player}, {uuid}
stat-wipe-commands:
  - "clearstats {player}"

# This server's name in the proxy config. Leave empty on a standalone server.
server-name: ""

# Verbose logging.
debug: false

# Seconds between auto reports per player.
report-cooldown: 60

# Violations before an auto report, per check name or "default".
report-violation-threshold:
  default: 10
