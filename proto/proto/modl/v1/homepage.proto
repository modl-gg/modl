syntax = "proto3";
package modl.v1;

import "google/protobuf/timestamp.proto";

message HomepageCardResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  string icon = 4;
  string icon_color = 5;
  string action_type = 6;
  string action_url = 7;
  reserved 8;
  reserved "action_button_text";
  string category_id = 9;
  string background_color = 10;
  int32 ordinal = 11;
  bool is_enabled = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  EmbeddedCategory category = 15;

  message EmbeddedCategory {
    string id = 1;
    string name = 2;
    string slug = 3;
    string description = 4;
    repeated ArticleStub articles = 5;
  }

  message ArticleStub {
    string id = 1;
    string title = 2;
    string slug = 3;
    int32 ordinal = 4;
  }
}

message PublicHomepageCardsResponse {
  repeated HomepageCardResponse cards = 1;
}

