name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      line: ${{ steps.preflight.outputs.line }}
      major: ${{ steps.preflight.outputs.major }}
      prerelease: ${{ steps.preflight.outputs.prerelease }}
      make_latest: ${{ steps.preflight.outputs.make_latest }}
      move_minor: ${{ steps.preflight.outputs.move_minor }}
      move_major: ${{ steps.preflight.outputs.move_major }}
      min_upgrade_from: ${{ steps.preflight.outputs.min_upgrade_from }}
      critical: ${{ steps.preflight.outputs.critical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preflight
        id: preflight
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-preflight.sh

  build:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      image-check: false

  image:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            MODL_SOURCE_COMMIT=${{ github.sha }}
            MODL_SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    needs: [verify, build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.write.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modl-dist
          path: dist

      - name: Write the release manifest
        id: write
        env:
          DIST_DIR: dist
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ github.sha }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          MIN_UPGRADE_FROM: ${{ needs.verify.outputs.min_upgrade_from }}
          CRITICAL: ${{ needs.verify.outputs.critical }}
          OUTPUT: manifest.json
        run: |
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .github/scripts/release-manifest.sh >> "$GITHUB_OUTPUT"
          {
            echo "### Release manifest for approval"
            echo '```json'
            jq . manifest.json
            echo '```'
            echo "Manifest SHA-256: $(sha256sum manifest.json | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modl-manifest
          path: manifest.json
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: [manifest]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modl-manifest
          path: .

      - name: Sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.MODL_RELEASE_SIGNING_KEY }}
          MANIFEST_SHA256: ${{ needs.manifest.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          echo "$MANIFEST_SHA256  manifest.json" | sha256sum -c -
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in manifest.json -out manifest.sig
          key_id="$(openssl pkey -in "$key" -pubout -outform DER | sha256sum | cut -c1-16)"
          jq -n --arg keyId "$key_id" --arg payload "$(base64 -w0 manifest.json)" \
            --arg signature "$(base64 -w0 manifest.sig)" \
            '{format:1,keyId:$keyId,payload:$payload,signature:$signature}' > modl-release.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modl-release-envelope
          path: modl-release.json
          if-no-files-found: error
          retention-days: 14

  verify-signature:
    needs: [verify, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modl-dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modl-manifest
          path: signed

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modl-release-envelope
          path: signed

      - name: Verify the signature and artifacts
        env:
          ENVELOPE: signed/modl-release.json
          MANIFEST: signed/manifest.json
          KEYS_FILE: libs/update-protocol/src/main/resources/gg/modl/update/release-keys.txt
          DIST_DIR: dist
          VERSION: ${{ needs.verify.outputs.version }}
        run: .github/scripts/release-verify.sh

  attest:
    needs: [verify, image, verify-signature]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modl-dist
          path: dist

      - name: Checksum the release artifacts
        working-directory: dist
        run: sha256sum -- modl-*.jar modl-*.zip > ../SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [verify, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modl-dist
          path: release-files

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modl-release-envelope
          path: release-files

      - name: Add the compose files
        run: |
          rm release-files/release-contract.json
          cp docker-compose.yml release-files/docker-compose.yml
          cp .env.example release-files/modl.env.example

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FILES_DIR: release-files
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.verify.outputs.make_latest }}
        run: .github/scripts/release-publish.sh

  image-tags:
    needs: [verify, image, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
          LINE: ${{ needs.verify.outputs.line }}
          MAJOR: ${{ needs.verify.outputs.major }}
          MOVE_MINOR: ${{ needs.verify.outputs.move_minor }}
          MOVE_MAJOR: ${{ needs.verify.outputs.move_major }}
          MAKE_LATEST: ${{ needs.verify.outputs.make_latest }}
        run: .github/scripts/release-tags.sh
