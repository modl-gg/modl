name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      image-check:
        description: Build the Docker image without pushing it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    name: Java build and SQLite tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build and test
        env:
          MODL_SOURCE_COMMIT: ${{ github.sha }}
          MODL_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: ./gradlew build dist

      - name: Sign and verify a manifest with a throwaway key
        env:
          DIST_DIR: dist
        run: .github/scripts/release-selftest.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modl-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  dialects:
    name: SQL tests on ${{ matrix.dialect }}
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: mysql-8.4
            http-task: httpTestMysql
          - dialect: mariadb-10.11
            http-task: httpTestMariadb
          - dialect: mariadb-11.4
            http-task: httpTestMariadbLatest
          - dialect: postgresql-15
            http-task: httpTestPostgresql
          - dialect: postgresql-17
            http-task: httpTestPostgresqlLatest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: SQL contract and HTTP tests
        env:
          MODL_TEST_DIALECTS: ${{ matrix.dialect }}
        run: ./gradlew :backend:sqlTest ":backend:${{ matrix.http-task }}" -Pmodl.skipPanel=true

  panel:
    name: Panel checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            proto/package-lock.json

      - name: Install the npm workspace
        run: npm ci --no-audit --no-fund

      - name: Check the panel
        run: npm run check

      - name: Lint the proto sources
        run: |
          npm ci --prefix proto --no-audit --no-fund
          npm --prefix proto run lint

  docker:
    if: ${{ inputs.image-check != false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: modl-selfhost:ci
          build-args: |
            MODL_SOURCE_COMMIT=${{ github.sha }}
            MODL_SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        env:
          IMAGE: modl-selfhost:ci
        run: .github/scripts/image-smoke.sh
